<svg viewBox="-30 0 850 133" xmlns="http://www.w3.org/2000/svg" style="background: #000000">
  <!-- Background rectangle with gradient -->
  <rect x="-30" y="0" width="850" height="133" fill="url(#bgGradient)"/>
  
  <!-- Gradients -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1320"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    
    <!-- Line gradient - using the teal accent colors -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#5eead4"/>
    </linearGradient>
  </defs>

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="0.75">
    <!-- Vertical grid lines -->
    <line x1="40" y1="20" x2="40" y2="113"/>
    <line x1="139" y1="20" x2="139" y2="113"/>
    <line x1="238" y1="20" x2="238" y2="113"/>
    <line x1="337" y1="20" x2="337" y2="113"/>
    <line x1="436" y1="20" x2="436" y2="113"/>
    <line x1="535" y1="20" x2="535" y2="113"/>
    <line x1="634" y1="20" x2="634" y2="113"/>
    <line x1="733" y1="20" x2="733" y2="113"/>
    <line x1="800" y1="20" x2="800" y2="113"/>
    
    <!-- Horizontal grid lines -->
    <line x1="40" y1="20" x2="800" y2="20"/>
    <line x1="40" y1="39" x2="800" y2="39"/>
    <line x1="40" y1="58" x2="800" y2="58"/>
    <line x1="40" y1="77" x2="800" y2="77"/>
    <line x1="40" y1="96" x2="800" y2="96"/>
    <line x1="40" y1="113" x2="800" y2="113"/>
  </g>

  <!-- Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="200">
    <!-- Distance labels - using secondary text color -->
    <g fill="rgba(255,255,255,0.7)">
      <text x="40" y="125" text-anchor="middle">0m</text>
      <text x="238" y="125" text-anchor="middle">50m</text>
      <text x="436" y="125" text-anchor="middle">100m</text>
      <text x="634" y="125" text-anchor="middle">150m</text>
      <text x="800" y="125" text-anchor="middle">200m</text>
    </g>

    <!-- Speed labels - using primary text color -->
    <g fill="rgba(255,255,255,0.9)">
      <text x="35" y="23" text-anchor="end">1.6</text>
      <text x="35" y="62" text-anchor="end">1.4</text>
      <text x="35" y="98" text-anchor="end">1.2</text>
    </g>

    <!-- Axis label - using secondary text color -->
    <text transform="translate(9, 43) rotate(-90)" 
          text-anchor="middle" 
          fill="rgba(255,255,255,0.7)"
          font-size="11">speed [m/s]</text>
  </g>

  <!-- Speed line -->
  <g>
    <!-- Main line -->
    <path d="M40,58 H115 V45 H190 V51 H265 V66 H340 V63 H415 V66 H490 V52 H565 V66 H640 V71 H715 V66 H790" 
          stroke="url(#lineGradient)" 
          stroke-width="1.5"
          fill="none"/>
  </g>
</svg>